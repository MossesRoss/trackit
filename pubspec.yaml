name: trackit
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # CORE APP FUNCTIONALITY
  cupertino_icons: ^1.0.8
  url_launcher: ^6.2.6
  shared_preferences: ^2.2.3   
  permission_handler: ^11.4.0 
  http: ^1.2.1 
  fl_chart: ^0.68.0 
  intl: ^0.19.0 

  # NOTIFICATIONS & TIME
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4

  # --- PRODUCTION-READY DEPENDENCIES ---
  # Firebase
  firebase_core: ^2.15.1
  firebase_auth: ^4.9.0
  cloud_firestore: ^4.9.1
  google_sign_in: ^6.1.5

  # State Management
  provider: ^6.0.5

  # Secure API Key Management
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^3.0.0 
  flutter_launcher_icons: ^0.13.1 

# FIX: Corrected the image_path to point directly to the icon file.
flutter_icons:
  android: true
  image_path: "assets/icon.png"

flutter:
  uses-material-design: true
  
  # FIX: Declared the assets folder and subfolders so the app can find the images.
  # You should have your icon at 'assets/icon.png' and the google logo at 'assets/google_logo.png'
  assets:
    - .env
    - assets/
    - assets/icon/

