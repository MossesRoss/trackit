# AI Commit Analyzer & Issue Suggester
# Author: Mosses
# Version: 1.0.5
#
# Changelog:
# v1.0.5 - Fix "unexpected EOF" error by correctly passing the commit SHA
#          between steps using GITHUB_OUTPUT, instead of trying to
#          execute a shell command inside an 'env:' block.
#        - Clean up 'get_diff' step to use GITHUB_OUTPUT delimiter correctly.
# v1.0.4 - The definitive fix. Moved the multiline SYSTEM_PROMPT to an 'env:' block
#          to resolve the YAML parser conflict with the 'run:' block.
# v1.0.3 - Failed attempt to fix shell error using 'cat <<EOF' inline.
# v1.0.2 - Fix "bad substitution" double-expansion error by using 'jq'.
# v1.0.1 - Fix shell 'bad substitution' error by correcting API_URL syntax.
# v1.0.0 - Initial creation.
name: AI Commit Analyzer

on:
  push:
    branches:
      - main
  # Add this trigger to test manually from the "Actions" tab
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  analyze-commit:
    runs-on: ubuntu-latest
    steps:
      # 1. Check out the code to access the git history
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # 2. Get the raw diff of the last commit
      - name: Get last commit diff
        id: get_diff
        run: |
          # Use the GITHUB_OUTPUT multiline string format
          # This is the robust way to do this.
          echo "RAW_DIFF<<EOF" >> $GITHUB_OUTPUT
          git diff HEAD~1 HEAD >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # 3. Call the Gemini API for suggestions
      - name: Call Gemini API
        id: gemini_call
        env:
          SYSTEM_PROMPT: |
            You are an expert senior software developer and product manager. Analyze the following 'git diff' from a new commit. Your goal is to find opportunities for new features, code improvements, or potential bugs.
            
            - Provide 2-3 concise, actionable suggestions.
            - Format your response as a clean markdown list.
            - If the commit is minor (e.g., a typo fix, formatting, updating comments), just respond with the single phrase: 'No suggestions for this minor update.'
        run: |
          # The API URL for Gemini 2.5 Flash
          API_URL="https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${{ secrets.GEMINI_API_KEY }}"
          
          # Get the raw diff content from the previous step
          RAW_DIFF_CONTENT="${{ steps.get_diff.outputs.RAW_DIFF }}"
          
          # Get the short hash of the commit for the title
          COMMIT_SHA_SHORT=$(git rev-parse --short HEAD)

          # Create the JSON payload for the Gemini API
          JSON_PAYLOAD=$(jq -n \
            --arg sp "$SYSTEM_PROMPT" \
            --arg commit_sha "$COMMIT_SHA_SHORT" \
            --arg raw_diff "$RAW_DIFF_CONTENT" \
            '{
              "systemInstruction": { "parts": [{"text": $sp}] },
              "contents": [ { "parts": [{"text": "Analyze this git diff from commit \\($commit_sha):\n\n\\($raw_diff)"}] } ]
            }'
          )

          # Make the API call with curl and save the JSON response
          API_RESPONSE_TEXT=$(curl -s -X POST -H "Content-Type: application/json" -d "${JSON_PAYLOAD}" "${API_URL}" | jq -r '.candidates[0].content.parts[0].text // "Error: Could not parse AI response."')
          
          # Save the AI's suggestions to a GitHub output variable
          echo "SUGGESTIONS<<EOF" >> $GITHUB_OUTPUT
          echo "$API_RESPONSE_TEXT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # ***FIX***: Save the commit SHA for the next step
          echo "COMMIT_SHA_SHORT=$COMMIT_SHA_SHORT" >> $GITHUB_OUTPUT

      # 4. Create the new GitHub Issue
      - name: Create GitHub Issue with Suggestions
        # This 'if' condition is correct
        if: steps.gemini_call.outputs.SUGGESTIONS != 'No suggestions for this minor update.'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ***FIX***: Read the values from the previous step's outputs
          # Do not run shell commands in the 'env:' block
          COMMIT_SHA: ${{ steps.gemini_call.outputs.COMMIT_SHA_SHORT }}
          SUGGESTIONS: ${{ steps.gemini_call.outputs.SUGGESTIONS }}
        run: |
          # The env variables are now correctly populated before this 'run' block starts
          gh issue create \
            --title "AI Suggestions for commit ${COMMIT_SHA}" \
            --body "Our AI bot analyzed commit \`${COMMIT_SHA}\` and has the following suggestions:
            
            ---
            
            ${SUGGESTIONS}" \
            --label "ai-suggestion,needs-review"
