name: AI Commit Analyzer
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  analyze-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      
      - name: Get last commit diff
        id: get_diff
        run: |
          echo "RAW_DIFF<<EOF" >> $GITHUB_OUTPUT
          git diff HEAD~1 HEAD >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Call Gemini API
        id: gemini_call
        env:
          # UPDATED PROMPT: Asking for JSON output with specific fields
          SYSTEM_PROMPT: |
            You are a senior developer. Analyze the git diff.
            Return a JSON object with exactly two fields: "title" and "body".
            
            1. "title": A short, punchy summary of the most important change (max 50 chars). Example: "Fix Cache Invalid Logic" or "Add User Auth Middleware".
            2. "body": A concise markdown list of the specific fixes or improvements. No fluff, no intros. Just the points.
            
            If the commit is minor (typos, formatting), return: { "title": "Minor Update", "body": "No significant suggestions." }
          RAW_DIFF: ${{ steps.get_diff.outputs.RAW_DIFF }}
        run: |
          API_URL="https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${{ secrets.GEMINI_API_KEY }}"
          
          COMMIT_SHA_SHORT=$(git rev-parse --short HEAD)
          
          # We request JSON responseMimeType to ensure structured output
          JSON_PAYLOAD=$(jq -n \
            --arg sp "$SYSTEM_PROMPT" \
            --arg commit_sha "$COMMIT_SHA_SHORT" \
            --arg raw_diff "$RAW_DIFF" \
            '{
              "systemInstruction": { "parts": [{"text": $sp}] },
              "contents": [ { "parts": [{"text": "Analyze commit \($commit_sha):\n\n\($raw_diff)"}] } ],
              "generationConfig": { "responseMimeType": "application/json" }
            }'
          )
          
          # 1. Call API
          API_RESPONSE=$(curl -s -X POST -H "Content-Type: application/json" -d "${JSON_PAYLOAD}" "${API_URL}")
          
          # 2. Extract the model's inner JSON text (which contains title and body)
          MODEL_OUTPUT_JSON=$(echo "$API_RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty')
          
          if [ -z "$MODEL_OUTPUT_JSON" ]; then
            echo "Error: Empty response from AI"
            exit 1
          fi

          # 3. Parse the title and body from the model's JSON
          ISSUE_TITLE=$(echo "$MODEL_OUTPUT_JSON" | jq -r '.title')
          ISSUE_BODY=$(echo "$MODEL_OUTPUT_JSON" | jq -r '.body')
          
          # 4. Export to GitHub Outputs
          echo "ISSUE_TITLE=$ISSUE_TITLE" >> $GITHUB_OUTPUT
          
          echo "ISSUE_BODY<<EOF" >> $GITHUB_OUTPUT
          echo "$ISSUE_BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          echo "COMMIT_SHA_SHORT=$COMMIT_SHA_SHORT" >> $GITHUB_OUTPUT

      - name: Create GitHub Issue with Suggestions
        # Only create issue if title is not "Minor Update"
        if: steps.gemini_call.outputs.ISSUE_TITLE != 'Minor Update'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ steps.gemini_call.outputs.COMMIT_SHA_SHORT }}
          TITLE: ${{ steps.gemini_call.outputs.ISSUE_TITLE }}
          BODY: ${{ steps.gemini_call.outputs.ISSUE_BODY }}
        run: |
          # Use the AI-generated Title and concise Body
          gh issue create \
            --title "$TITLE (Commit $COMMIT_SHA)" \
            --body "$BODY" \
            --label "ai-suggestion,needs-review"
