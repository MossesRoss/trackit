=name: AI Commit Analyzer
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  analyze-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      
      - name: Get last commit diff
        id: get_diff
        run: |
          echo "RAW_DIFF<<EOF" >> $GITHUB_OUTPUT
          git diff HEAD~1 HEAD >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Call Gemini API
        id: gemini_call
        env:
          # UPDATED PROMPT: STRICT JSON instructions
          SYSTEM_PROMPT: |
            You are a senior developer. Analyze the git diff.
            Return a valid JSON object with exactly two fields: "title" and "body".
            Do NOT use Markdown code blocks. Just return the raw JSON.
            
            1. "title": A short, technical summary of the fix. Example: "Fix Cache Invalid Logic" or "Refactor User Auth". (Max 60 chars).
            2. "body": A concise markdown list of the specific fixes. No fluff.
            
            If the commit is minor, return: { "title": "Minor Update", "body": "No significant suggestions." }
          RAW_DIFF: ${{ steps.get_diff.outputs.RAW_DIFF }}
        run: |
          API_URL="[https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=$](https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=$){{ secrets.GEMINI_API_KEY }}"
          COMMIT_SHA_SHORT=$(git rev-parse --short HEAD)
          
          # Construct JSON Payload
          JSON_PAYLOAD=$(jq -n \
            --arg sp "$SYSTEM_PROMPT" \
            --arg commit_sha "$COMMIT_SHA_SHORT" \
            --arg raw_diff "$RAW_DIFF" \
            '{
              "systemInstruction": { "parts": [{"text": $sp}] },
              "contents": [ { "parts": [{"text": "Analyze commit \($commit_sha):\n\n\($raw_diff)"}] } ],
              "generationConfig": { "responseMimeType": "application/json" }
            }'
          )
          
          # Call API - Remove -s to see curl errors if any
          echo "Sending request to Gemini..."
          API_RESPONSE=$(curl -X POST -H "Content-Type: application/json" -d "${JSON_PAYLOAD}" "${API_URL}")
          
          # DEBUG: Print raw response to logs to catch errors
          echo "--- GEMINI RAW RESPONSE ---"
          echo "$API_RESPONSE"
          echo "---------------------------"
          
          # Clean output: Remove markdown code blocks if present (```json ... ```)
          CLEAN_JSON=$(echo "$API_RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty' | sed 's/^```json//g' | sed 's/^```//g')
          
          if [ -z "$CLEAN_JSON" ]; then
            echo "Error: Failed to parse valid JSON from AI response."
            exit 1
          fi

          # Extract Title and Body
          ISSUE_TITLE=$(echo "$CLEAN_JSON" | jq -r '.title')
          ISSUE_BODY=$(echo "$CLEAN_JSON" | jq -r '.body')
          
          echo "ISSUE_TITLE=$ISSUE_TITLE" >> $GITHUB_OUTPUT
          
          echo "ISSUE_BODY<<EOF" >> $GITHUB_OUTPUT
          echo "$ISSUE_BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          echo "COMMIT_SHA_SHORT=$COMMIT_SHA_SHORT" >> $GITHUB_OUTPUT

      - name: Create GitHub Issue with Suggestions
        if: steps.gemini_call.outputs.ISSUE_TITLE != 'Minor Update'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ steps.gemini_call.outputs.COMMIT_SHA_SHORT }}
          TITLE: ${{ steps.gemini_call.outputs.ISSUE_TITLE }}
          BODY: ${{ steps.gemini_call.outputs.ISSUE_BODY }}
        run: |
          gh issue create \
            --title "$TITLE" \
            --body "$BODY" \
            --label "ai-suggestion,needs-review"
